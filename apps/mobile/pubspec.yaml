name: mobile
description: "Project Ascend — AI-first fitness, nutrition, and wellness companion app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0

  # Motion & sharing
  flutter_animate: ^4.5.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.1

  # Media Platform (Build Session 8 Part 3) — one reusable picker/camera/
  # playback layer shared by Community, profiles, Trainer Groups, Fuel,
  # and Vision, instead of each feature wiring its own.
  image_picker: ^1.1.2
  video_player: ^2.9.2
  permission_handler: ^11.3.1
  mime: ^2.0.0

  # Testable wall-clock access (RestTimer) — `clock.now()` instead of raw
  # `DateTime.now()` so widget tests can drive it via Flutter's fake-time
  # test zone instead of waiting on real wall-clock seconds.
  clock: ^1.1.1
  geolocator: ^14.0.2
  health: ^13.3.1

  # Local, device-scheduled notifications (Build Session 9 Part 9) — the
  # OS delivers these even if the app process isn't running, so no
  # background service/isolate is needed. Real push delivery (Firebase/
  # APNs) is a separate, currently-unconfigured concern — see
  # NotificationsService's Noop push provider on the backend.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Atlas/Nova voice V1 (Build Session 9 Part 14) — on-device speech
  # recognition and speech synthesis only; no audio is ever sent to a
  # server, and both packages are only touched once the user explicitly
  # taps the mic or turns on "speak replies" — see
  # core/voice/speech_to_text_service.dart and
  # core/voice/text_to_speech_service.dart.
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Store purchases (Build Session 9 Part 17/18) — the official Flutter
  # plugin wrapping StoreKit (iOS) and Google Play Billing (Android). The
  # client only ever collects a platform receipt/purchase token; the
  # backend's PurchasesModule does the actual verification against
  # Apple/Google before any entitlement changes — see
  # features/purchases/data/purchase_service.dart.
  in_app_purchase: ^3.2.0

  # Live Vision pose engine (Build Session 10 Part 2) — `camera` drives
  # the live preview/image stream; `google_mlkit_pose_detection` is
  # Google's current maintained on-device (never uploaded) BlazePose
  # implementation for Flutter. Both are wrapped behind
  # core/vision/pose/data/pose_detector_adapter.dart so no exercise
  # analyzer or screen imports either package directly.
  camera: ^0.12.0+2
  google_mlkit_pose_detection: ^0.15.0

  # Real Google/Apple sign-in clients (Build Session 10 Parts 9/10) — the
  # official plugins for obtaining a provider-issued ID token, which the
  # backend's GoogleTokenVerifier/AppleTokenVerifier then verify
  # server-side (see auth-identities/providers/). Neither plugin talks to
  # Ascend's own servers.
  google_sign_in: ^7.1.0
  sign_in_with_apple: ^8.1.0

  # Remote push notifications (Build Session 11 Part 5) — the backend's
  # FcmPushNotificationProvider already sends via FCM's HTTP v1 API; these
  # are the client-side plugins that receive it. No live Firebase project
  # exists in this environment (no google-services.json/
  # GoogleService-Info.plist), so `Firebase.initializeApp()` is wrapped
  # defensively — see FirebasePushNotificationService.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # Vision release diagnostics screen (S14 Part 19) — app version/build
  # number and device model/OS version, surfaced for QA testers filling
  # out qa/vision-physical-device-checklist.md and for bug reports. Both
  # were already present as transitive deps; promoted to direct here
  # since core/diagnostics now imports them directly.
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
