name: mobile
description: "Project Ascend — AI-first fitness, nutrition, and wellness companion app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Motion & sharing
  flutter_animate: ^4.5.2
  share_plus: ^10.1.3

  # Testable wall-clock access (RestTimer) — `clock.now()` instead of raw
  # `DateTime.now()` so widget tests can drive it via Flutter's fake-time
  # test zone instead of waiting on real wall-clock seconds.
  clock: ^1.1.1
  geolocator: ^14.0.2
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
