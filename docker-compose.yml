services:
  postgres:
    image: postgres:16-alpine
    container_name: ascend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ascend_dev_password
      POSTGRES_DB: ascend_dev
    ports:
      - "5432:5432"
    volumes:
      - ascend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend -d ascend_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies pending Prisma migrations and exits. The api
  # service below won't start until this exits 0, so `docker compose up`
  # always leaves the database schema in sync before anything serves
  # traffic — never `prisma migrate dev`, which is interactive/dev-only.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migrate
    container_name: ascend-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ascend:ascend_dev_password@postgres:5432/ascend_dev?schema=public
    restart: "no"
    # S14 Part 29 — a plain `prisma migrate deploy` process needs no
    # Linux capabilities at all; safe to drop every one rather than
    # inherit Docker's (already-reduced, but non-empty) default set.
    # Not applied to postgres/pgadmin below: those official images'
    # entrypoints need specific capabilities (CHOWN/SETUID/SETGID/
    # DAC_OVERRIDE) to fix data-directory ownership on first boot, and
    # this sandbox has no Docker daemon to verify a change there
    # wouldn't break `docker compose up` — see admin-deployment.md.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    container_name: ascend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://ascend:ascend_dev_password@postgres:5432/ascend_dev?schema=public
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    # S14 Part 29 — same rationale as the migrate service above.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ascend-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@projectascend.local
      PGADMIN_DEFAULT_PASSWORD: dev_password
    ports:
      - "5050:80"

volumes:
  ascend_pgdata:
