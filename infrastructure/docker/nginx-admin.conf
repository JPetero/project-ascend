# S14 Part 28/29 — serves the admin app's static build with security
# headers appropriate for an internal, RBAC-gated tool. This alone is
# not sufficient access control: staging-deployment.md's admin section
# expects this to sit behind an additional network-level restriction
# (VPN, IP allowlist, or SSO) — these headers are defense in depth on
# top of that, not a substitute for it.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in error pages/headers.
    server_tokens off;

    # Never framed by another origin (no legitimate reason to iframe an
    # admin panel), never MIME-sniffed, and never indexed/crawled — the
    # same "not for a search engine" intent as public/robots.txt and
    # index.html's <meta name="robots">, enforced here at the HTTP layer
    # so it also applies to any response this server issues directly.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # object-src/frame-ancestors 'none' block the two classic CSP-bypass
    # vectors (Flash/plugin content, this page being framed elsewhere).
    # connect-src is intentionally scoped to https: rather than the
    # exact backend origin: this static nginx config is built once and
    # reused across environments, and the real backend host is only
    # known at *app* build time (VITE_API_BASE_URL — see
    # apps/admin/src/config/apiConfigValidation.ts), not at this nginx
    # config's own build/deploy time. A deployment that wants this
    # tightened to one exact origin can render this file from a template
    # with nginx's built-in envsubst-on-startup mechanism instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location / {
        # SPA fallback: any unmatched path serves index.html so
        # react-router's client-side routes resolve on a hard refresh.
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite's build — safe to cache
    # aggressively; index.html itself is deliberately excluded (falls
    # through to the default nginx caching, effectively no long cache)
    # since it references those hashed filenames and must always be
    # fetched fresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
