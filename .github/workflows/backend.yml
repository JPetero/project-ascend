name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend.yml"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend_dev_password
          POSTGRES_DB: ascend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ascend -d ascend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ascend:ascend_dev_password@localhost:5432/ascend_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGIN: "*"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter @project-ascend/api...

      - name: Generate Prisma client
        run: pnpm --filter @project-ascend/api prisma:generate

      - name: Apply migrations
        run: pnpm --filter @project-ascend/api prisma:deploy

      - name: Lint
        run: pnpm --filter @project-ascend/api lint

      - name: Unit tests
        run: pnpm --filter @project-ascend/api test

      - name: E2E tests
        run: pnpm --filter @project-ascend/api test:e2e

      - name: Build
        run: pnpm --filter @project-ascend/api build
