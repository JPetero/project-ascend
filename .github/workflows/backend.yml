name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "infrastructure/docker/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "infrastructure/docker/**"
      - ".github/workflows/backend.yml"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend_dev_password
          POSTGRES_DB: ascend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ascend -d ascend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ascend:ascend_dev_password@localhost:5432/ascend_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGIN: "*"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --filter @project-ascend/api... --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @project-ascend/api exec prisma validate

      - name: Check Prisma schema formatting
        # `prisma format` has no --check flag (unlike `dart format`); it
        # always formats in place, so drift is detected via git diff.
        run: |
          pnpm --filter @project-ascend/api exec prisma format
          git diff --exit-code -- services/api/prisma/schema.prisma

      - name: Generate Prisma client
        run: pnpm --filter @project-ascend/api prisma:generate

      - name: Apply migrations against Postgres
        run: pnpm --filter @project-ascend/api prisma:deploy

      - name: Lint
        run: pnpm --filter @project-ascend/api lint

      - name: Unit tests
        run: pnpm --filter @project-ascend/api test

      - name: E2E tests
        run: pnpm --filter @project-ascend/api test:e2e

      - name: Build
        run: pnpm --filter @project-ascend/api build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: runtime
          push: false
          load: true
          tags: project-ascend-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          target: migrate
          push: false
          load: true
          tags: project-ascend-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
