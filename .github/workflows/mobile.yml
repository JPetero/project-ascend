name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: flutter test

  android-build:
    # S13 Part 16-27 — a real installable artifact from every push/PR
    # touching the mobile app, not just analyze/test. Builds the "prod"
    # flavor's release APK; with no key.properties in this repo (real
    # signing secrets are never committed — see
    # apps/mobile/android/key.properties.example), this signs with the
    # debug keystore, same honest fallback
    # apps/mobile/android/app/build.gradle.kts uses locally. That's fine
    # for a CI-downloadable test build, but it is NOT a Play
    # Store-ready artifact until a real key.properties is provisioned
    # (see the Founder setup checklist).
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build prod release APK
        run: >
          flutter build apk --release --flavor prod
          --dart-define=ENVIRONMENT=prod

      - uses: actions/upload-artifact@v4
        with:
          name: ascend-prod-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 14
