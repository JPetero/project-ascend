name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: flutter test

  # S14 Part 3 — replaces the old "ascend-prod-release-apk" job, which
  # silently debug-signed a binary named like a production artifact and
  # never passed a production API URL. Every push/PR now gets an
  # honestly-labeled test build instead: the `staging` flavor pointed at
  # STAGING_API_BASE_URL when that repo variable is configured, or the
  # `dev` flavor's genuinely-safe emulator-only default when it isn't —
  # never something that pretends to be production-ready. This build is
  # test-signed on purpose (see build.gradle.kts's S14 Part 1 comment);
  # only `production-build` below produces a real release-signed
  # artifact, and only when guarded secrets are actually present.
  staging-or-dev-build:
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build staging APK
        if: ${{ vars.STAGING_API_BASE_URL != '' }}
        run: >
          flutter build apk --release --flavor staging
          --dart-define=ENVIRONMENT=staging
          --dart-define=API_BASE_URL=${{ vars.STAGING_API_BASE_URL }}

      - name: Upload staging/internal APK
        if: ${{ vars.STAGING_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ascend-staging-internal
          path: apps/mobile/build/app/outputs/flutter-apk/app-staging-release.apk
          retention-days: 14

      - name: Build development-sideload APK (no staging backend configured yet)
        if: ${{ vars.STAGING_API_BASE_URL == '' }}
        run: flutter build apk --release --flavor dev --dart-define=ENVIRONMENT=dev

      - name: Upload development-sideload APK
        if: ${{ vars.STAGING_API_BASE_URL == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ascend-development-sideload
          path: apps/mobile/build/app/outputs/flutter-apk/app-dev-release.apk
          retention-days: 14

  # Guarded — only runs on push to main, and only once real production
  # signing + a real production API host are configured as repo
  # secrets. Never fires for pull requests (forked PRs never get
  # secrets, and production artifacts have no reason to build per-PR
  # anyway). Produces a real release-signed AAB (Play upload-ready) and,
  # for manual QA convenience, the equivalent signed APK — never
  # auto-published anywhere.
  production-build:
    runs-on: ubuntu-latest
    needs: analyze-test
    # Job-level `if:` cannot reference the `secrets` context (only
    # `github`/`needs`/`vars`/`inputs` are valid there — `secrets` is
    # only available in step-level `if:`/`env:` and job-level `env:`).
    # Referencing secrets here made GitHub Actions reject the entire
    # workflow file at parse time (every job, not just this one) —
    # confirmed via a real failed run (mcp__github__actions_list showed
    # zero jobs scheduled at all). The secret-presence check below is
    # done via job `env:` (secrets ARE valid there) plus a step-level
    # `if:` on every step that needs them instead.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ASCEND_KEYSTORE_PATH: ${{ github.workspace }}/ascend-upload-keystore.jks
      ASCEND_KEYSTORE_PASSWORD: ${{ secrets.ASCEND_KEYSTORE_PASSWORD }}
      ASCEND_KEY_ALIAS: ${{ secrets.ASCEND_KEY_ALIAS }}
      ASCEND_KEY_PASSWORD: ${{ secrets.ASCEND_KEY_PASSWORD }}
      HAS_PRODUCTION_SECRETS: ${{ secrets.ASCEND_KEYSTORE_BASE64 != '' && secrets.ASCEND_KEYSTORE_PASSWORD != '' && secrets.ASCEND_KEY_ALIAS != '' && secrets.ASCEND_KEY_PASSWORD != '' && secrets.PROD_API_BASE_URL != '' }}

    steps:
      - uses: actions/checkout@v4
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}

      - uses: subosito/flutter-action@v2
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - uses: actions/setup-java@v4
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}
        run: flutter pub get

      - name: Decode upload keystore
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}
        run: echo "${{ secrets.ASCEND_KEYSTORE_BASE64 }}" | base64 -d > "$ASCEND_KEYSTORE_PATH"

      - name: Build signed production AAB (Play upload-ready)
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}
        run: >
          flutter build appbundle --release --flavor prod
          --dart-define=ENVIRONMENT=prod
          --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}

      - name: Build signed production APK (manual QA)
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}
        run: >
          flutter build apk --release --flavor prod
          --dart-define=ENVIRONMENT=prod
          --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$ASCEND_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}
        with:
          name: ascend-prod-signed-aab
          path: apps/mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_PRODUCTION_SECRETS == 'true' }}
        with:
          name: ascend-prod-signed-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 30
