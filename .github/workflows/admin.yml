name: Admin CI

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      # S15 Part 10 — admin.Dockerfile and nginx-admin.conf live here, so
      # a change to either must trigger this workflow's docker-build job.
      # Without this filter, the admin image could break in a commit that
      # never ran the job that builds it.
      - "infrastructure/docker/**"
      - ".github/workflows/admin.yml"
  pull_request:
    paths:
      - "apps/admin/**"
      - "infrastructure/docker/**"
      - ".github/workflows/admin.yml"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --filter @project-ascend/admin... --frozen-lockfile

      - name: Lint
        run: pnpm admin:lint

      - name: Tests
        run: pnpm admin:test

      # S14 Part 28 — a production `vite build` now refuses to start
      # without a real VITE_API_BASE_URL (see
      # apps/admin/src/config/apiConfigValidation.ts), so CI needs one to
      # prove the build pipeline itself works. This is a CI-only
      # placeholder, not a real deployment target — see
      # staging-deployment.md for what a real admin deploy needs.
      - name: Build
        env:
          VITE_API_BASE_URL: https://ci-placeholder.invalid
        run: pnpm admin:build

  # S15 Part 10 — admin.Dockerfile carried a comment saying it was "not
  # build-verified in this sandbox" (true: no privileged Docker daemon is
  # available here). That is exactly why it needs to be built in real CI,
  # where a daemon does exist — an unbuilt Dockerfile is an untested one,
  # and the staging deployment bundle depends on this image existing.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build admin runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/admin.Dockerfile
          target: runtime
          push: false
          load: true
          tags: project-ascend-admin:ci
          # Same CI-only placeholder the Build step above uses: proves the
          # ARG/ENV plumbing works end to end without baking a real host
          # into a throwaway image.
          build-args: |
            VITE_API_BASE_URL=https://ci-placeholder.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually runs, not merely that it built — a
      # static-asset image that builds but serves nothing is a real
      # failure mode (wrong dist path, bad nginx config). nginx-unprivileged
      # listens on 8080.
      - name: Verify the image serves the built admin bundle
        run: |
          docker run -d --name admin-ci -p 8080:8080 project-ascend-admin:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "Admin image served a response after ${i}s."
              curl -fsS http://127.0.0.1:8080/ | head -c 400
              docker rm -f admin-ci
              exit 0
            fi
            sleep 1
          done
          echo "Admin image never served a response on :8080 — dumping logs." >&2
          docker logs admin-ci >&2
          docker rm -f admin-ci
          exit 1

  # S15 Part 11 — publishes alongside the api/migrate images from
  # backend.yml so infrastructure/staging/docker-compose.staging.yml can
  # pull all three at one pinned tag.
  #
  # NOTE ON VITE_API_BASE_URL: unlike the API, the admin app's API host is
  # baked into the static bundle at build time, so a published image is
  # only usable by a deployment whose admin API host matches what CI built
  # it with. STAGING_API_BASE_URL (a repository *variable*, not a secret —
  # it is just a hostname) is used when set; when it is not, the image is
  # still published with the placeholder so the pipeline itself stays
  # verified, and infrastructure/staging/README.md documents rebuilding
  # with the real host. This is deliberately honest rather than pretending
  # a placeholder build is deployable.
  publish-image:
    runs-on: ubuntu-latest
    needs: [lint-test-build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and API base URL
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "admin=ghcr.io/${owner}/project-ascend-admin" >> "$GITHUB_OUTPUT"
          if [ -n "${{ vars.STAGING_API_BASE_URL }}" ]; then
            echo "api_base_url=${{ vars.STAGING_API_BASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "baked=real staging host" >> "$GITHUB_OUTPUT"
          else
            echo "api_base_url=https://ci-placeholder.invalid" >> "$GITHUB_OUTPUT"
            echo "baked=CI placeholder (STAGING_API_BASE_URL not set)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/admin.Dockerfile
          target: runtime
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ steps.names.outputs.api_base_url }}
          tags: |
            ${{ steps.names.outputs.admin }}:main
            ${{ steps.names.outputs.admin }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize what was published
        run: |
          {
            echo "### Published admin image"
            echo ""
            echo "\`${{ steps.names.outputs.admin }}\` tagged \`main\` and \`${{ github.sha }}\`."
            echo ""
            echo "API base URL baked into the bundle: **${{ steps.names.outputs.baked }}**."
          } >> "$GITHUB_STEP_SUMMARY"
