name: Admin CI

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin.yml"
  pull_request:
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin.yml"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --filter @project-ascend/admin... --frozen-lockfile

      - name: Lint
        run: pnpm admin:lint

      - name: Tests
        run: pnpm admin:test

      # S14 Part 28 — a production `vite build` now refuses to start
      # without a real VITE_API_BASE_URL (see
      # apps/admin/src/config/apiConfigValidation.ts), so CI needs one to
      # prove the build pipeline itself works. This is a CI-only
      # placeholder, not a real deployment target — see
      # staging-deployment.md for what a real admin deploy needs.
      - name: Build
        env:
          VITE_API_BASE_URL: https://ci-placeholder.invalid
        run: pnpm admin:build
